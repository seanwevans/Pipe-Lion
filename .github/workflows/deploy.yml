name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      # --out-dir is resolved relative to the crate, so this must climb out of
      # core/ to reach the directory Vite copies into the site.
      - name: Build WebAssembly package
        run: wasm-pack build core --target web --out-dir ../docs/public/pkg

      - name: Verify Wasm package landed in the site assets
        run: test -f docs/public/pkg/core_bg.wasm && test -f docs/public/pkg/core.js

      - name: Install frontend dependencies
        working-directory: docs
        run: npm ci

      - name: Run frontend tests
        working-directory: docs
        run: npm run test -- --run

      - name: Run Wasm core tests
        run: cargo test --manifest-path core/Cargo.toml

      - name: Build site
        working-directory: docs
        run: npm run build

      - name: Verify built site includes the Wasm bundle
        run: test -f docs/dist/pkg/core_bg.wasm && test -f docs/dist/pkg/core.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
