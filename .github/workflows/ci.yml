name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pre-commit

      - name: Run pre-commit
        id: precommit
        continue-on-error: true
        run: pre-commit run --all-files

      - name: Commit pre-commit changes
        if: steps.precommit.outcome == 'failure' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: apply pre-commit fixes"

      - name: Rerun pre-commit
        if: steps.precommit.outcome == 'failure'
        run: pre-commit run --all-files

  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo fmt --check
        run: cargo fmt --manifest-path core/Cargo.toml --all -- --check

      # Deliberately not `-D warnings`: the toolchain floats on stable, so a new
      # clippy release can introduce lints that turn main red with no code
      # change. Warnings stay visible in the log; only real errors fail the job.
      - name: Run cargo clippy
        run: cargo clippy --manifest-path core/Cargo.toml --all-targets --all-features

      - name: Run cargo test
        run: cargo test --manifest-path core/Cargo.toml --all-features

  webapp:
    name: Webapp checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Run lint
        working-directory: docs
        run: npm run lint

      # The deploy workflow runs these too, but only after a merge to main.
      # Running them here keeps a broken build off main in the first place.
      - name: Run tests
        working-directory: docs
        run: npm run test -- --run

      - name: Build site
        working-directory: docs
        run: npm run build
